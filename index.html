<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operations Command Center</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050a18;--s1:#0c1425;--s2:#131d35;--bd:#1c2d4a;--tx:#e8ecf4;--mt:#6b7fa3;--c0:#3b82f6;--c1:#10b981;--c2:#f59e0b;--c3:#ef4444;--c4:#8b5cf6;--c5:#06b6d4}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;height:100vh;width:100vw}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 24px;background:linear-gradient(135deg,#080e20,#111b33);border-bottom:1px solid var(--bd);height:56px}
.hdr-l{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff}
.hdr-t{font-size:20px;font-weight:900;letter-spacing:-.5px}
.hdr-st{font-size:9px;color:var(--mt);font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
.live{display:flex;align-items:center;gap:6px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);padding:4px 12px;border-radius:16px;font-size:10px;font-weight:700;color:#10b981}
.ldot{width:7px;height:7px;border-radius:50%;background:#10b981;animation:bl 1.4s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
.clk{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.clk-d{font-size:10px;color:var(--mt);text-align:right}
.dots{display:flex;gap:4px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--bd);cursor:pointer;transition:.3s}
.dot.on{width:20px;border-radius:3px;background:var(--c0)}
.slider{height:calc(100vh - 56px);overflow:hidden}
.track{display:flex;height:100%;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.slide{width:100vw;height:100%;flex-shrink:0;padding:12px 20px;overflow:hidden;display:flex;flex-direction:column}
.ogrid{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:100%}
.oc{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;position:relative;overflow:hidden;cursor:pointer}
.oc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0}
.oc-top{display:flex;align-items:center;justify-content:space-between}
.oc-ic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.oc-n{font-size:42px;font-weight:900;line-height:1;letter-spacing:-2px}
.oc-lb{font-size:12px;font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.oc-sb{font-size:10px;color:var(--mt);margin-top:2px}
.oc-ml{margin-top:auto;padding-top:6px;border-top:1px solid var(--bd)}
.oc-mr{display:flex;justify-content:space-between;padding:3px 0;font-size:11px;border-bottom:1px solid rgba(28,45,74,.3)}
.oc-mr:last-child{border:none}
.oc-mn{font-weight:600;max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc-mv{color:var(--mt);font-size:10px}
.c0::before{background:var(--c0)}.c0 .oc-ic{background:rgba(59,130,246,.1)}.c0 .oc-n{color:var(--c0)}
.c1::before{background:var(--c1)}.c1 .oc-ic{background:rgba(16,185,129,.1)}.c1 .oc-n{color:var(--c1)}
.c2::before{background:var(--c2)}.c2 .oc-ic{background:rgba(245,158,11,.1)}.c2 .oc-n{color:var(--c2)}
.c3::before{background:var(--c3)}.c3 .oc-ic{background:rgba(239,68,68,.1)}.c3 .oc-n{color:var(--c3)}
.c4::before{background:var(--c4)}.c4 .oc-ic{background:rgba(139,92,246,.1)}.c4 .oc-n{color:var(--c4)}
.c5::before{background:var(--c5)}.c5 .oc-ic{background:rgba(6,182,212,.1)}.c5 .oc-n{color:var(--c5)}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-shrink:0}
.di{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.dt{font-size:22px;font-weight:900;letter-spacing:-.5px}
.dc{font-size:11px;padding:3px 10px;border-radius:6px;font-weight:700}
.flt{margin-left:auto;display:flex;gap:4px}
.fb{padding:5px 12px;border:1px solid var(--bd);border-radius:6px;background:transparent;color:var(--mt);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
.fb.on{background:var(--c0);color:#fff;border-color:var(--c0)}
.tw{flex:1;overflow:auto;border-radius:8px;border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse}
thead th{background:var(--s2);padding:8px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;z-index:10;white-space:nowrap}
tbody td{padding:7px 12px;font-size:12px;font-weight:500;border-bottom:1px solid rgba(28,45,74,.3);white-space:nowrap}
tbody tr:hover{background:rgba(255,255,255,.015)}
.ch{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700}
.ch.ip{background:rgba(245,158,11,.1);color:#f59e0b}.ch.pd{background:rgba(239,68,68,.1);color:#ef4444}.ch.cp{background:rgba(16,185,129,.1);color:#10b981}.ch.ap{background:rgba(59,130,246,.1);color:#3b82f6}
.db{font-weight:800;font-size:12px;padding:2px 8px;border-radius:5px}
.db.ok{background:rgba(16,185,129,.1);color:#10b981}.db.wr{background:rgba(245,158,11,.1);color:#f59e0b}.db.dn{background:rgba(239,68,68,.1);color:#ef4444}
.em{padding:30px;text-align:center;color:var(--mt);font-size:12px}
.tb{position:fixed;bottom:0;left:0;right:0;height:3px;background:var(--s2);z-index:200}
.tf{height:100%;width:0%;transition:width 1s linear;background:var(--c0)}
.ld{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;transition:opacity .5s}
.ld.h{opacity:0;pointer-events:none}
.sp{width:40px;height:40px;border:3px solid var(--bd);border-top-color:var(--c0);border-radius:50%;animation:sn .7s linear infinite}
@keyframes sn{to{transform:rotate(360deg)}}
.ld p{margin-top:12px;color:var(--mt);font-size:12px}
</style>
</head>
<body>
<div class="ld" id="ld"><div class="sp"></div><p id="ldt">Loading live data...</p></div>

<div class="hdr">
<div class="hdr-l"><div class="logo">⚡</div><div><div class="hdr-t">Operations Command Center</div><div class="hdr-st">Live TV Dashboard</div></div></div>
<div style="display:flex;align-items:center;gap:14px"><div class="dots" id="dots"></div><div class="live"><span class="ldot"></span>LIVE</div></div>
<div><div class="clk" id="clk">--:--</div><div class="clk-d" id="clkd">--</div></div>
</div>

<div class="slider"><div class="track" id="trk">
<div class="slide"><div class="ogrid" id="ogrid"></div></div>
<div class="slide" id="sl1"></div>
<div class="slide" id="sl2"></div>
<div class="slide" id="sl3"></div>
<div class="slide" id="sl4"></div>
<div class="slide" id="sl5"></div>
<div class="slide" id="sl6"></div>
</div></div>
<div class="tb"><div class="tf" id="tf"></div></div>

<script>
var SID="1iN9bWTjjNDFuwchaw1PikmbquIPhTcmCByGtccf4IWY";
var TOTAL=7,SLIDE_SEC=120,cur=0,tmr=0;

var CFG=[
  {name:"Today Deliveries",sheet:"Today Deliveries Hub Dashboard",gid:0,icon:"📦",cls:"c0",
   heads:["Date","Client Name","Sale Order","DN Number"],cols:[1,2,3,5],dateCol:1,defF:0,color:"59,130,246"},
  {name:"Site Work Entry",sheet:"Site Work Entry",gid:1491806736,icon:"🔧",cls:"c1",
   heads:["Date","Client","Sale Order","Staff","Qty","Unit","Status"],cols:[1,2,3,4,6,7,9],dateCol:1,defF:3,color:"16,185,129",statusCol:9,statusVal:"in progress",miniCols:[2,1]},
  {name:"Site Visit & Technical",sheet:"Site Visit and Technical Workflow Dashboard",gid:1835648226,icon:"📋",cls:"c2",
   heads:["Date","Requested By","Client","Visit Status","Tech Drawing","Client Approval"],cols:[0,2,3,7,14,16],dateCol:0,defF:0,color:"245,158,11"},
  {name:"Machine Job Register",sheet:"Operations Job Register Dashboard",gid:1402558379,icon:"⚙️",cls:"c3",
   heads:["Start Date","Client","Sale Order","Machine","End Date","Days","Status"],cols:[0,1,3,2,5,7,6],dateCol:0,defF:3,color:"239,68,68",statusCol:6,statusVal:"in progress",miniCols:[1,2]},
  {name:"Master Inventory",sheet:"master inventory catalog",gid:983402358,icon:"📊",cls:"c4",
   heads:["Date","Client","Sale Order","Item No","Person","Qty"],cols:[0,1,2,3,4,5],dateCol:0,defF:0,color:"139,92,246"},
  {name:"Weekly Delivery",sheet:"Weekly Delivery schedule",gid:1009335742,icon:"🚚",cls:"c5",
   heads:["Client Name","Sale Order","Expected Date","Remarks"],cols:[1,2,3,4],dateCol:3,defF:3,color:"6,182,212",miniCols:[1,3]}
];

var filters=CFG.map(function(c){return c.defF});
var raw=CFG.map(function(){return[]});

// Clock
function tick(){var n=new Date();document.getElementById('clk').textContent=n.toLocaleTimeString('en-US',{hour12:true,hour:'2-digit',minute:'2-digit',second:'2-digit'});document.getElementById('clkd').textContent=n.toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'short',year:'numeric'})}
setInterval(tick,1000);tick();

// Dots
var dh='';for(var i=0;i<TOTAL;i++)dh+='<div class="dot'+(i===0?' on':'')+'" onclick="go('+i+')"></div>';
document.getElementById('dots').innerHTML=dh;

// Build overview
document.getElementById('ogrid').innerHTML=CFG.map(function(c,i){
  return'<div class="oc '+c.cls+'" onclick="go('+(i+1)+')">'
    +'<div class="oc-top"><div class="oc-ic">'+c.icon+'</div></div>'
    +'<div class="oc-lb" style="font-size:14px;margin-top:8px">'+c.name+'</div><div class="oc-sb" id="sb'+i+'"></div>'
    +'<div class="oc-ml" id="ml'+i+'"></div></div>';
}).join('');

// Build detail slides
CFG.forEach(function(c,i){
  var fl;
  if(c.statusCol!==undefined||i===5){fl=[['All',3],['Weekly',1],['Monthly',2]]}
  else{fl=[['Daily',0],['Weekly',1],['Monthly',2]]}
  document.getElementById('sl'+(i+1)).innerHTML=
    '<div class="dh"><div class="di" style="background:rgba('+c.color+',.1)">'+c.icon+'</div>'
    +'<div class="dt">'+c.name+'</div>'
    +'<div class="dc" id="dc'+i+'" style="background:rgba('+c.color+',.1);color:rgb('+c.color+')">0</div>'
    +'<div class="flt">'+fl.map(function(f){return'<button class="fb'+(f[1]===c.defF?' on':'')+'" onclick="sf('+i+','+f[1]+',this)">'+f[0]+'</button>'}).join('')+'</div></div>'
    +'<div class="tw"><table><thead><tr><th>#</th>'+c.heads.map(function(h){return'<th>'+h+'</th>'}).join('')+'</tr></thead>'
    +'<tbody id="tb'+i+'"></tbody></table></div>';
});

// Slider
function go(i){cur=i;tmr=0;document.getElementById('trk').style.transform='translateX(-'+i*100+'vw)';document.querySelectorAll('.dot').forEach(function(d,x){d.classList.toggle('on',x===i)});document.getElementById('tf').style.width='0%'}
setInterval(function(){tmr++;document.getElementById('tf').style.width=(tmr/SLIDE_SEC*100)+'%';if(tmr>=SLIDE_SEC)go((cur+1)%TOTAL)},1000);
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' ')go((cur+1)%TOTAL);else if(e.key==='ArrowLeft')go((cur-1+TOTAL)%TOTAL)});

function sf(s,v,btn){filters[s]=v;btn.parentElement.querySelectorAll('.fb').forEach(function(b){b.classList.remove('on')});btn.classList.add('on');renderSection(s)}

function sheetURL(name,gid){return"https://docs.google.com/spreadsheets/d/"+SID+"/gviz/tq?tqx=out:csv&gid="+gid+"&t="+Date.now()}

function parseCSV(t){var rows=[],row=[],cell='',q=false;for(var i=0;i<t.length;i++){var c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else{if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell);if(row.length>1||row[0]!=='')rows.push(row);row=[];cell=''}else if(c!=='\r')cell+=c}}if(cell||row.length){row.push(cell);if(row.length>1||row[0]!=='')rows.push(row)}return rows}

function inRange(ds,mode){
  if(mode===3)return true;
  if(!ds)return mode>=1;
  var now=new Date();now.setHours(0,0,0,0);
  var d=new Date(ds);
  if(isNaN(d)){var p=ds.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);if(p){d=new Date(p[3],p[2]-1,p[1]);if(isNaN(d))d=new Date(p[3],p[1]-1,p[2])}else return mode>=1}
  if(isNaN(d))return mode>=1;
  d.setHours(0,0,0,0);var diff=(now-d)/864e5;
  if(mode===0)return diff>=0&&diff<1;
  if(mode===1)return diff>-7&&diff<7;
  return diff>-30&&diff<30;
}

function esc(v){if(v==null)return'';var d=document.createElement('div');d.textContent=String(v).trim();return d.innerHTML}

function chip(v){
  var s=String(v||'').toLowerCase();
  if(s.indexOf('completed')>-1||s==='true'||s==='done')return'<span class="ch cp">'+esc(v)+'</span>';
  if(s.indexOf('progress')>-1||s==='working'||s==='work')return'<span class="ch ip">'+esc(v)+'</span>';
  if(s==='pending')return'<span class="ch pd">'+esc(v)+'</span>';
  if(s==='approved'||s==='worked')return'<span class="ch ap">'+esc(v)+'</span>';
  if(s.indexOf('not')>-1)return'<span class="ch pd">'+esc(v)+'</span>';
  return esc(v);
}

function getRows(idx){
  var c=CFG[idx],data=raw[idx];if(!data||data.length<2)return[];
  return data.slice(1).filter(function(r){
    if(!r||r.length<2||r[0]==='')return false;
    var f=filters[idx];
    if(c.statusCol!==undefined&&f===3){var st=String(r[c.statusCol]||'').trim().toLowerCase();if(st.indexOf(c.statusVal)===-1)return false}
    return inRange(r[c.dateCol],f);
  });
}

function renderSection(idx){
  var c=CFG[idx],rows=getRows(idx);
  document.getElementById('dc'+idx).textContent=rows.length;
  var tb=document.getElementById('tb'+idx);
  if(!rows.length){tb.innerHTML='<tr><td colspan="'+(c.heads.length+1)+'"><div class="em">'+c.icon+' No data</div></td></tr>';return}
  tb.innerHTML=rows.map(function(r,i){
    return'<tr><td style="color:var(--mt);font-weight:700;font-size:11px">'+(i+1)+'</td>'+c.cols.map(function(col,ci){
      var v=r[col]||'';var h=c.heads[ci];
      if(h.indexOf('Status')>-1||h.indexOf('Approval')>-1||h.indexOf('Drawing')>-1)return'<td>'+chip(v)+'</td>';
      if(h==='Days')return'<td><span class="db '+(parseInt(v)>7?'dn':parseInt(v)>3?'wr':'ok')+'">'+parseInt(v||0)+'d</span></td>';
      if(h==='Client'||h==='Client Name')return'<td style="font-weight:700">'+esc(v)+'</td>';
      if(h==='Sale Order')return'<td><code style="background:var(--s2);padding:2px 6px;border-radius:3px;font-size:11px">'+esc(v)+'</code></td>';
      if(h==='Machine'||h==='DN Number')return'<td style="font-weight:700;color:rgb('+c.color+')">'+esc(v)+'</td>';
      return'<td>'+esc(v)+'</td>';
    }).join('')+'</tr>';
  }).join('');
}

function renderAll(){
  var labels=['Today','Active','Today','Active','Today','All'];
  CFG.forEach(function(c,i){
    var rows=getRows(i);
    document.getElementById('sb'+i).textContent=labels[i]+' — '+rows.length+' items';
    var el=document.getElementById('ml'+i);
    var items=rows.slice(0,3);
    el.innerHTML=items.length?items.map(function(r){
      var nameCol=c.miniCols?c.miniCols[0]:c.cols[1];
      var valCol=c.miniCols?c.miniCols[1]:c.cols[c.cols.length-1];
      return'<div class="oc-mr"><span class="oc-mn">'+esc(r[nameCol]||r[c.cols[0]])+'</span><span class="oc-mv">'+esc(r[valCol]||'')+'</span></div>';
    }).join(''):'<div style="color:var(--mt);font-size:10px;padding:4px">No items</div>';
    renderSection(i);
  });
}

async function loadData(){
  try{
    document.getElementById('ldt').textContent='Fetching...';
    var results=await Promise.all(CFG.map(function(c){return fetch(sheetURL(c.sheet,c.gid)).then(function(r){return r.text()})}));
    results.forEach(function(t,i){raw[i]=parseCSV(t)});
    renderAll();
    document.getElementById('ld').classList.add('h');
  }catch(e){document.getElementById('ldt').textContent='Retrying...';setTimeout(loadData,10000)}
}

loadData();
setInterval(loadData,60000);
</script>
</body>
</html>
